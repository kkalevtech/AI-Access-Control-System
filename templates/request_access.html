{% extends "base.html" %}
{% block title %}Request Access - AI Access Control{% endblock %}
{% block content %}
<div class="page-header">
    <h1 class="page-title">Request Access</h1>
</div>

<div class="card" style="max-width: 500px;">
    <form method="post" action="{{ url_for('request_access') }}">
        <div class="form-group">
            <label class="form-label" for="user_id">Select User</label>
            <select name="user_id" id="user_id" class="form-select" required>
                <option value="">-- Select User --</option>
                {% for user in users %}
                <option value="{{ user.id }}">{{ user.name }} ({{ user.assigned_room }})</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="location">Location</label>
            <input type="text" name="location" id="location" class="form-input" placeholder="e.g., IT-101" required>
        </div>
        
        <button type="submit" class="btn btn-primary">Request Access</button>
    </form>
</div>
{% endblock %}
